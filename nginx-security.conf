# Security headers, in a snippet because nginx does not merge add_header across
# levels: the moment a location block declares one add_header of its own, every
# add_header inherited from the server block is silently discarded. So this file
# is included in the server block *and* in each location that sets a header,
# which is the only arrangement that actually delivers all of them.
#
# The Content-Security-Policy below must stay in step with the meta tag the pages
# carry — scripts/chrome.mjs is the source of that policy, check.mjs fails if the
# two drift apart. GitHub Pages cannot set headers at all, which is why the
# policy is duplicated into the markup. The only permitted difference is
# frame-ancestors, which a meta tag cannot express.
#
# Do not add upgrade-insecure-requests here either: a delivered header policy and
# a meta policy combine, so putting it back in one place is enough to break every
# review over http://localhost in Safari. chrome.mjs explains why.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self' mailto:; frame-src 'none'; frame-ancestors 'none'; worker-src 'self' blob:; manifest-src 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Nothing on this site uses any of them, so decline them all up front.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Only meaningful once served over TLS from a real domain; harmless before.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
