# Serves the built site. Used by `docker compose up` for a production-shaped
# local check, and ready for the day the site moves off GitHub Pages onto a
# European host — which is the only place these headers can take effect, since
# GitHub Pages does not let you set any.
#
# nginx-security.conf is included in every location rather than only at the top:
# see the comment in that file for why that is not redundant.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    include /etc/nginx/snippets/security.conf;

    # --- routing ----------------------------------------------------------

    location / {
        include /etc/nginx/snippets/security.conf;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # --- caching ----------------------------------------------------------

    # Hashed filenames, so these can never go stale.
    location /assets/ {
        include /etc/nginx/snippets/security.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Fonts are versioned by content rather than by name, so a shorter window.
    location /fonts/ {
        include /etc/nginx/snippets/security.conf;
        expires 30d;
        access_log off;
    }

    # HTML must always be revalidated or a deploy takes a day to appear.
    # `expires` rather than add_header, so the snippet above still applies.
    location ~* \.html$ {
        include /etc/nginx/snippets/security.conf;
        expires -1;
    }

    location = /.well-known/security.txt {
        include /etc/nginx/snippets/security.conf;
        default_type text/plain;
        expires 1d;
    }

    location ~ ^/(robots\.txt|sitemap\.xml|site\.webmanifest)$ {
        include /etc/nginx/snippets/security.conf;
        expires 1d;
    }

    # --- errors -----------------------------------------------------------

    error_page 404 /404.html;

    location = /404.html {
        include /etc/nginx/snippets/security.conf;
        internal;
        expires -1;
    }

    # Dotfiles are not content. .well-known is matched above and wins on `=`.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
